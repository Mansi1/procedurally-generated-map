<!doctype html>
<!-- Galerie aller L-System-Beispiele. Aufruf: npm run dev, dann
     http://localhost:5173/tools/lsystem/gallery.html -->
<html lang="de">
<head>
<meta charset="utf-8">
<title>L-System-Galerie</title>
<style>
  :root { color-scheme: dark; --bg: #1b1d1a; --panel: #25282a; --line: #3a3f41; --text: #e4e2da; --muted: #9a9c94; }
  body { margin: 0; padding: 16px 20px 40px; background: var(--bg); color: var(--text); font: 13px system-ui, sans-serif; }
  header { display: flex; align-items: baseline; gap: 16px; }
  h1 { font-size: 18px; margin: 0; }
  a { color: var(--text); }
  h2 { font-size: 14px; color: var(--muted); font-weight: 500; margin: 24px 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .card { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; text-decoration: none; }
  .card:hover { border-color: var(--muted); }
  .card canvas { width: 100%; height: 210px; display: block; }
  .card span { padding: 6px 8px; }
</style>
</head>
<body>
<header><h1>L-System-Galerie</h1><a href="?leaves=shape">Form</a><a href="?leaves=texture">Foto</a><a href="?leaves=shape&cards=0">Form, Einzelblätter</a><a href="?leaves=texture&cards=0">Foto, Einzelblätter</a><a href="./">zur Spielwiese</a></header>
<main></main>
<script type="module" src="./gallery.ts"></script>
</body>
</html>
