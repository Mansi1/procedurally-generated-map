<!-- Zeichnet ein Spielmodell als Symbol (tools/ui/icons.mjs setzt die Daten ein). -->
<html><body style="margin:0;background:transparent"><canvas id="c" width="256" height="256"></canvas>
<script src="icondata.js"></script><script>
function parse(src,mtl){const K={};let cur;for(const l of mtl.split('\n')){const a=l.trim().split(/\s+/);if(a[0]=='newmtl')cur=a[1];if(a[0]=='Kd')K[cur]=a.slice(1).map(Number)}
K.Paint=K.Paint||[.3,.55,.25];K.Tunic=[0.25,0.63,0.28];K.Load=[0.5,0.35,0.2];
const P=[],T=[];let m='',o='';for(const l of src.split('\n')){const a=l.trim().split(/\s+/);if(a[0]=='v')P.push(a.slice(1).map(Number));if(a[0]=='o')o=a[1];if(a[0]=='usemtl')m=a[1];if(a[0]=='f'){const c=a.slice(1).map(i=>P[+i.split('/')[0]-1]);for(let i=1;i+1<c.length;i++)T.push({k:K[m]||[.6,.6,.6],o,p:[c[0],c[i],c[i+1]]});}}return T.filter(t=>!/^(Load|Arm\.R\.Lower\.Tool)/.test(t.o))}
const W=256,H=256,ctx=document.getElementById('c').getContext('2d');
function render(items,yaw,pitch){const img=ctx.createImageData(W,H);const zb=new Float32Array(W*H).fill(-1e9);
const all=[];for(const [T,dx] of items)for(const t of T)all.push({k:t.k,p:t.p.map(p=>[p[0]+dx,p[1],p[2]])});
const tr=p=>{let [x,y,z]=p;const c=Math.cos(yaw),s=Math.sin(yaw);[x,z]=[x*c+z*s,-x*s+z*c];const cp=Math.cos(pitch),sp=Math.sin(pitch);[y,z]=[y*cp-z*sp,y*sp+z*cp];return [x,y,z]};
const V=all.map(t=>t.p.map(tr));let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const q of V)for(const p of q){x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1]);}
const S=0.9*Math.min(W/(x1-x0),H/(y1-y0)),cx=W/2-(x0+x1)/2*S,cy=H/2+(y0+y1)/2*S;const L=[0.45,0.75,0.5],ln=Math.hypot(...L);
V.forEach((a,ti)=>{const u=a[1].map((v,i)=>v-a[0][i]),w=a[2].map((v,i)=>v-a[0][i]);let n=[u[1]*w[2]-u[2]*w[1],u[2]*w[0]-u[0]*w[2],u[0]*w[1]-u[1]*w[0]];const nl=Math.hypot(...n);if(nl<1e-12)return;n=n.map(v=>v/nl);if(n[2]<0)n=n.map(v=>-v);
const li=0.5+0.75*Math.max(0,(n[0]*L[0]+n[1]*L[1]+n[2]*L[2])/ln);const col=all[ti].k.map(v=>Math.min(255,v*li*255));
const q=a.map(p=>[cx+p[0]*S,cy-p[1]*S,p[2]]);const [A,B,C]=q;const den=(B[1]-C[1])*(A[0]-C[0])+(C[0]-B[0])*(A[1]-C[1]);if(Math.abs(den)<1e-9)return;
const xa=Math.max(0,Math.floor(Math.min(A[0],B[0],C[0]))),xb=Math.min(W-1,Math.ceil(Math.max(A[0],B[0],C[0]))),ya=Math.max(0,Math.floor(Math.min(A[1],B[1],C[1]))),yb=Math.min(H-1,Math.ceil(Math.max(A[1],B[1],C[1])));
for(let y=ya;y<=yb;y++)for(let x=xa;x<=xb;x++){const px=x+.5,py=y+.5;const l1=((B[1]-C[1])*(px-C[0])+(C[0]-B[0])*(py-C[1]))/den,l2=((C[1]-A[1])*(px-C[0])+(A[0]-C[0])*(py-C[1]))/den,l3=1-l1-l2;if(l1<0||l2<0||l3<0)continue;
const z=l1*A[2]+l2*B[2]+l3*C[2];const i=y*W+x;if(z<=zb[i])continue;zb[i]=z;img.data[i*4]=col[0];img.data[i*4+1]=col[1];img.data[i*4+2]=col[2];img.data[i*4+3]=255;}});
ctx.putImageData(img,0,0);}
const k=new URLSearchParams(location.search).get('k');
if(k=='population')render([[parse(D.female.obj,D.female.mtl),-0.35],[parse(D.male.obj,D.male.mtl),0.35]],-0.25,0.15);
else if(k=='idle')render([[parse(D.male.obj,D.male.mtl),0]],-0.3,0.15);
else render([[parse(D[k].obj,D[k].mtl),0]],-0.6,0.42);
</script></body></html>
