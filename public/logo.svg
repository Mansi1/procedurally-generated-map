<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160">
  <title>Soliva</title>
  <defs>
    <clipPath id="logo-badge">
      <circle cx="80" cy="80" r="62" />
    </clipPath>
    <linearGradient id="logo-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8e2a0" />
      <stop offset="1" stop-color="#e59a4e" />
    </linearGradient>
    <linearGradient id="logo-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe7a3" />
      <stop offset="0.55" stop-color="#e2b04c" />
      <stop offset="1" stop-color="#b07a24" />
    </linearGradient>
  </defs>

  <!-- Wappen: goldener Rand um eine weite Landschaft mit einer einzelnen Birke -->
  <circle cx="80" cy="80" r="74" fill="#3a2614" />
  <circle cx="80" cy="80" r="69" fill="url(#logo-gold)" />
  <circle cx="80" cy="80" r="64" fill="#3a2614" />
  <g clip-path="url(#logo-badge)">
    <rect x="0" y="0" width="160" height="160" fill="url(#logo-sky)" />
    <!-- Sonne mit Strahlen -->
    <g fill="#fff1c4" opacity="0.55">
      <path d="M102 88 L132 40 L138 46 Z" />
      <path d="M102 88 L150 66 L151 74 Z" />
      <path d="M102 88 L112 32 L120 34 Z" />
    </g>
    <circle cx="102" cy="88" r="22" fill="#fff4d2" />
    <!-- Ferne Hügel, nahe Hügel, Weg ins Land -->
    <path d="M0 96 Q30 78 62 90 T124 84 T160 86 V160 H0 Z" fill="#8fb45a" />
    <path d="M0 108 Q40 92 80 104 T160 100 V160 H0 Z" fill="#6f9e3c" />
    <path d="M0 122 Q44 110 92 120 T160 118 V160 H0 Z" fill="#3f7a2e" />
    <path d="M86 160 Q94 136 112 122 Q118 119 122 120 Q104 132 100 160 Z" fill="#c9a66b" opacity="0.8" />
    <!-- Birke -->
    <path d="M52 128 L55.5 66 L59.5 66 L61 128 Z" fill="#f4f1e8" />
    <path d="M57 90 L68 76 L69.5 77.5 L59 92 Z" fill="#f4f1e8" />
    <path d="M56 100 L47 88 L45.8 89.4 L55.6 103 Z" fill="#f4f1e8" />
    <g fill="#1d1a16">
      <rect x="54.6" y="74" width="4.4" height="1.8" />
      <rect x="55.8" y="84" width="3.8" height="1.6" />
      <rect x="54.2" y="95" width="5" height="2" />
      <rect x="55.4" y="107" width="4.2" height="1.8" />
      <rect x="54" y="117" width="5.6" height="2.2" />
    </g>
    <!-- Lichte, hängende Krone -->
    <g>
      <ellipse cx="57" cy="56" rx="19" ry="22" fill="#8cc24a" />
      <ellipse cx="44" cy="68" rx="10" ry="15" fill="#6fa83a" />
      <ellipse cx="70" cy="68" rx="10" ry="16" fill="#78b140" />
      <ellipse cx="57" cy="44" rx="11" ry="12" fill="#a3d25c" />
      <path d="M38 70 Q37 86 40 94 M46 74 Q45 90 47 98 M68 74 Q69 90 67 99 M76 70 Q78 84 75 92"
        stroke="#6fa83a" stroke-width="3.2" stroke-linecap="round" fill="none" />
    </g>
  </g>

  <!-- Schriftzug -->
  <g font-family="'Cinzel', 'Trajan Pro', Georgia, 'Times New Roman', serif" font-weight="700" letter-spacing="8">
    <text x="176" y="102" font-size="68" fill="#2b1a0d" stroke="#2b1a0d" stroke-width="7" stroke-linejoin="round">SOLIVA</text>
    <text x="176" y="102" font-size="68" fill="url(#logo-gold)">SOLIVA</text>
  </g>
  <!-- Unterzeile: hell mit dunkler Kontur, damit sie auf Holz wie auf hellem Grund lesbar ist -->
  <text x="182" y="134" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700" font-size="20" letter-spacing="1.5"
    fill="#fbe7b5" stroke="#2b1a0d" stroke-width="4" stroke-linejoin="round" paint-order="stroke">one who wanders alone</text>
</svg>
