<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Soliva</title>
  <defs>
    <clipPath id="badge">
      <circle cx="32" cy="32" r="27" />
    </clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d98a" />
      <stop offset="1" stop-color="#e9a95a" />
    </linearGradient>
  </defs>
  <!-- Goldener Rand -->
  <circle cx="32" cy="32" r="31" fill="#3a2614" />
  <circle cx="32" cy="32" r="29" fill="#d9a441" />
  <g clip-path="url(#badge)">
    <!-- Himmel und aufgehende Sonne -->
    <rect x="0" y="0" width="64" height="64" fill="url(#sky)" />
    <circle cx="40" cy="36" r="11" fill="#fff4cf" />
    <!-- Hügel -->
    <path d="M0 40 Q16 30 32 38 T64 34 V64 H0 Z" fill="#6f9e3c" />
    <path d="M0 48 Q20 40 40 47 T64 46 V64 H0 Z" fill="#3f7a2e" />
    <!-- Birke: weißer Stamm mit schwarzen Marken, lichte Krone -->
    <path d="M22 50 L23.4 25 L25.4 25 L25.8 50 Z" fill="#f4f1e8" />
    <rect x="22.9" y="31" width="2.2" height="1.1" fill="#1d1a16" />
    <rect x="23.4" y="38" width="2" height="1.1" fill="#1d1a16" />
    <rect x="22.7" y="44" width="2.4" height="1.2" fill="#1d1a16" />
    <ellipse cx="24.5" cy="21" rx="8" ry="10" fill="#8cc24a" />
    <ellipse cx="21.5" cy="25" rx="4.5" ry="6" fill="#6fa83a" />
    <ellipse cx="27.5" cy="24" rx="4.5" ry="6.5" fill="#78b140" />
  </g>
</svg>
