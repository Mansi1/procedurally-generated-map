<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Map</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --panel: rgba(10, 14, 18, 0.72);
        --border: rgba(120, 220, 150, 0.35);
        --text: #cfe9d6;
        --accent: #6ee7a0;
      }
      body {
        background: #0a0d10;
        overflow: hidden;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--text);
      }
      #game {
        display: block;
        image-rendering: pixelated;
        cursor: crosshair;
      }
      .panel {
        position: absolute;
        background: var(--panel);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 13px;
        line-height: 1.7;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      }
      .panel b {
        color: var(--accent);
        font-weight: 600;
      }
      .sep {
        color: rgba(207, 233, 214, 0.3);
        margin: 0 6px;
      }
      #ui {
        top: 12px;
        left: 12px;
        /* Rechts daneben liegt das Vorrats-Panel - so weit reicht #ui nicht. */
        max-width: calc(100vw - 480px);
      }
      #ui kbd {
        background: rgba(110, 231, 160, 0.12);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1px 5px;
        font: inherit;
        color: var(--accent);
      }
      #legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        margin-top: 6px;
        padding-top: 6px;
        border-top: 1px solid rgba(120, 220, 150, 0.18);
      }
      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
      }
      .legend-item i {
        width: 11px;
        height: 11px;
        border-radius: 2px;
        border: 1px solid rgba(0, 0, 0, 0.45);
      }
      #debug {
        bottom: 12px;
        left: 12px;
        max-width: calc(100vw - 340px);
      }
      #stock {
        top: 12px;
        right: 12px;
        display: flex;
        gap: 14px;
        white-space: nowrap;
      }
      #stock .res {
        display: inline-flex;
        flex-direction: column;
        line-height: 1.35;
      }
      #stock .amount {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      /* Darunter: wie viele Dorfbewohner gerade daran arbeiten */
      #stock .workers {
        font-size: 11px;
        color: rgba(207, 233, 214, 0.6);
      }
      #stock .workers.busy {
        color: var(--text);
      }
      #stock .res i {
        width: 11px;
        height: 11px;
        border-radius: 2px;
        border: 1px solid rgba(0, 0, 0, 0.45);
      }
      #build {
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        padding: 8px;
      }
      .build-btn {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        min-width: 104px;
        padding: 6px 8px;
        font: inherit;
        font-size: 12px;
        color: var(--text);
        text-align: left;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(120, 220, 150, 0.22);
        border-radius: 6px;
        cursor: pointer;
      }
      .build-btn:hover {
        background: rgba(110, 231, 160, 0.1);
      }
      .build-btn[aria-pressed='true'] {
        border-color: var(--accent);
        background: rgba(110, 231, 160, 0.18);
      }
      /* Nicht bezahlbar: sichtbar, aber erkennbar aus dem Spiel genommen. */
      .build-btn[disabled] {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .build-btn .name {
        display: flex;
        align-items: center;
        gap: 6px;
        font-weight: 600;
        color: var(--accent);
      }
      .build-btn .name i {
        width: 9px;
        height: 9px;
        border-radius: 2px;
      }
      .build-btn .cost {
        color: rgba(207, 233, 214, 0.65);
        font-size: 11px;
      }
      #hint {
        position: absolute;
        bottom: 96px;
        left: 50%;
        transform: translateX(-50%);
        padding: 5px 12px;
        border-radius: 6px;
        background: rgba(120, 30, 40, 0.85);
        border: 1px solid rgba(255, 140, 150, 0.5);
        font-size: 12px;
        color: #ffd9dd;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.18s;
      }
      #hint.show {
        opacity: 1;
      }
      #selection {
        bottom: 96px;
        left: 12px;
        width: 300px;
      }
      #selection .title {
        color: var(--accent);
        font-weight: 600;
      }
      #selection .muted {
        color: rgba(207, 233, 214, 0.6);
        font-size: 12px;
      }
      #selection .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 6px;
      }
      #selection .bar {
        height: 5px;
        margin: 4px 0;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      #selection .bar i {
        display: block;
        height: 100%;
        background: var(--accent);
      }
      /* Auswahlrechteck beim Ziehen */
      #select-box {
        position: absolute;
        border: 1px solid var(--accent);
        background: rgba(110, 231, 160, 0.12);
        pointer-events: none;
      }
      #minimap {
        position: absolute;
        bottom: 12px;
        right: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #05070a;
        image-rendering: pixelated;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.55);
        cursor: pointer;
      }
      /* Kompass über der Minimap: Klick auf eine Himmelsrichtung dreht die
         Ansicht so, dass sie nach oben zeigt. */
      #compass {
        position: absolute;
        bottom: 326px;
        right: 12px;
        width: 78px;
        height: 78px;
        border-radius: 50%;
        background: var(--panel);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        border: 1px solid var(--border);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      }
      #compass button {
        position: absolute;
        width: 22px;
        height: 22px;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: transparent;
        color: var(--text);
        font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace;
        cursor: pointer;
        transition: left 0.25s, top 0.25s;
      }
      #compass button:hover {
        background: rgba(110, 231, 160, 0.18);
      }
      #compass button[data-dir='N'] {
        color: #ff7a6b;
      }
      #compass .needle {
        position: absolute;
        left: 35px;
        top: 17px;
        width: 8px;
        height: 44px;
        pointer-events: none;
        transition: transform 0.3s;
        transform-origin: 4px 22px;
        background: linear-gradient(#ff7a6b 0 50%, rgba(207, 233, 214, 0.55) 50% 100%);
        clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="ui" class="panel">
      <div>
        Pos <b id="pos">0, 0</b><span class="sep">|</span>
        Tiles/Px <b id="sampling">-</b><span class="sep">|</span>
        Zoom <b id="zoom">8px</b><span class="sep">|</span>
        <kbd>WASD</kbd> bewegen <kbd>Q</kbd>/<kbd>E</kbd> zoomen<span class="sep">|</span>
        <kbd>1</kbd>-<kbd>5</kbd> bauen <kbd>Esc</kbd> abbrechen<span class="sep">|</span>
        <kbd>Klick</kbd>/<kbd>Ziehen</kbd> auswählen <kbd>Rechtsklick</kbd> Befehl
        <kbd>V</kbd> Dorfbewohner <kbd>H</kbd> Hauptgebäude <kbd>Entf</kbd> abreißen
      </div>
      <div id="legend"></div>
    </div>

    <div id="debug" class="panel">
      <div>Tile <b id="tile-info">-</b></div>
      <div>
        Cursor <b id="cursor-coords">-, -</b><span class="sep">|</span>
        Kamera <b id="cam-coords">-, -</b><span class="sep">|</span>
        MiniMap <b id="hover-coords">-, -</b><span class="sep">|</span>
        FPS <b id="fps">0</b>
      </div>
    </div>

    <div id="stock" class="panel"></div>

    <div id="selection" class="panel"></div>
    <div id="select-box" hidden></div>

    <div id="hint"></div>
    <div id="build" class="panel"></div>

    <canvas id="minimap"></canvas>
    <div id="compass" title="Blickrichtung - klicke auf eine Himmelsrichtung">
      <div class="needle"></div>
      <button type="button" data-dir="N">N</button>
      <button type="button" data-dir="E">O</button>
      <button type="button" data-dir="S">S</button>
      <button type="button" data-dir="W">W</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
