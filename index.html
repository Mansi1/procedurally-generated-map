<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Map</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --panel: rgba(10, 14, 18, 0.72);
        --border: rgba(120, 220, 150, 0.35);
        --text: #cfe9d6;
        --accent: #6ee7a0;
      }
      body {
        background: #0a0d10;
        overflow: hidden;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--text);
      }
      #game {
        display: block;
        image-rendering: pixelated;
        cursor: crosshair;
      }
      .panel {
        position: absolute;
        background: var(--panel);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 13px;
        line-height: 1.7;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      }
      .panel b {
        color: var(--accent);
        font-weight: 600;
      }
      .sep {
        color: rgba(207, 233, 214, 0.3);
        margin: 0 6px;
      }
      #ui {
        top: 12px;
        left: 12px;
        max-width: calc(100vw - 24px);
      }
      #ui kbd {
        background: rgba(110, 231, 160, 0.12);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1px 5px;
        font: inherit;
        color: var(--accent);
      }
      #legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        margin-top: 6px;
        padding-top: 6px;
        border-top: 1px solid rgba(120, 220, 150, 0.18);
      }
      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
      }
      .legend-item i {
        width: 11px;
        height: 11px;
        border-radius: 2px;
        border: 1px solid rgba(0, 0, 0, 0.45);
      }
      #debug {
        bottom: 12px;
        left: 12px;
        max-width: calc(100vw - 340px);
      }
      #minimap {
        position: absolute;
        bottom: 12px;
        right: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #05070a;
        image-rendering: pixelated;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.55);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="ui" class="panel">
      <div>
        Pos <b id="pos">0, 0</b><span class="sep">|</span>
        Chunks <b id="chunks">0</b><span class="sep">|</span>
        Zoom <b id="zoom">8px</b><span class="sep">|</span>
        <kbd>WASD</kbd> bewegen <kbd>Q</kbd>/<kbd>E</kbd> oder Mausrad zoomen
      </div>
      <div id="legend"></div>
    </div>

    <div id="debug" class="panel">
      <div>Tile <b id="tile-info">-</b></div>
      <div>
        Cursor <b id="cursor-coords">-, -</b><span class="sep">|</span>
        Kamera <b id="cam-coords">-, -</b><span class="sep">|</span>
        MiniMap <b id="hover-coords">-, -</b><span class="sep">|</span>
        FPS <b id="fps">0</b>
      </div>
    </div>

    <canvas id="minimap"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
